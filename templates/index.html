{% extends "layout.html" %}

{% block title %}
    Roadmapper - Home
{% endblock %}

{% block body %}
    <h1>Roadmaps: </h1>
    <ul>
        {% for roadmap in roadmaps %}
            <li><a href="{{ url_for('view', id=roadmap.id) }}">{{ roadmap_name | default('Untitled', true) }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
