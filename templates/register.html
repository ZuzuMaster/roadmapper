{% extends "layout.html" %}

{% block title %}
    Roadmapper - Register
{% endblock %}

{% block body %}
    <style>
    input::placeholder {
        color: rgb(185, 174, 174);
    }
    </style>

    <div style="display: flex; flex-direction: column; gap: 60px; max-width: 400px;">
        <b style="text-decoration:underline;font-size: 30px;">Register</b>
        
        <form action="/register" method="post" style="display: flex; flex-direction: column; gap: 7px; max-width: 400px;">
            <input autocomplete="off" autofocus name="username" placeholder="Username" type="text" required style="font-size: 1.2rem; padding: 12px; background-color: rgb(128, 116, 97); color: rgb(248, 233, 233);">
            <input name="password" placeholder="Password" type="password" required style="font-size: 1.2rem; padding: 12px; background-color: rgb(128, 116, 97); color: rgb(248, 233, 233);">
            <input name="confirmation" placeholder="Confirm Password" type="password" required style="font-size: 1.2rem; padding: 12px; background-color: rgb(128, 116, 97); color: rgb(248, 233, 233);">
            <button type="submit" style="font-size: 1.05rem; padding: 12px;">Register</button>
        </form>

        <p style="font-size: 13px;">if you have an account, please login <a href="/login">here</a></p>
    </div>
{% endblock %}
